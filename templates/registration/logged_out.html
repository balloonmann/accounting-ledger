{% extends "base.html" %}

{% block title %}Signed Out — Household Ledger{% endblock %}

{% block auth_content %}
<div class="card login">
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
    <div class="brand-logo" style="width: 36px; height: 36px; font-size: 18px;">₹</div>
    <div>
      <div class="eyebrow" style="margin-bottom: 0;">HOUSEHOLD LEDGER</div>
      <div style="font-size: 12px; color: var(--muted-foreground);">ERP Financial Accounting</div>
    </div>
  </div>

  <h1>Signed out</h1>
  <p>You have been safely signed out of your session.</p>

  <div class="notice notice-info" style="margin-bottom: 20px;">
    <span>✓</span>
    <span>Your active session has been cleared securely.</span>
  </div>

  <a href="{% url 'login' %}" class="btn btn-primary" style="display: block; text-align: center; width: 100%;">
    Sign in again →
  </a>
</div>
{% endblock %}
